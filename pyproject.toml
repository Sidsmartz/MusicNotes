[project]
name = "musicnotes"
version = "0.1.0"
description = "Upload a video of yourself playing; MusicNotes finds the instrument and draws the notes, chords and hits on it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "onnx>=1.15",
  "pycairo>=1.25",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
musicnotes = "musicnotes.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["musicnotes*"]

[tool.setuptools.package-data]
musicnotes = ["assets/fonts/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
